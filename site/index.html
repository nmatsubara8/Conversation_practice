<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#162c2b">
<title>ことばの島</title>
<link rel="stylesheet" href="style.css?v=18">
<script type="module" src="island.js?v=27"></script>
</head>
<body>
<main>
  <header><h1>ことばの島</h1><span>米国英語</span></header>
  <section id="scene" aria-label="島の場面">
    <div id="place">浜辺</div>
    <div class="cloud"></div><div class="sea"></div><div class="shore"></div>
    <div class="hill"></div>
    <button id="tree" class="object" aria-label="木を指す" hidden>🌴</button>
    <button id="water" class="object" aria-label="水たまりを指す" hidden><span class="pool" aria-hidden="true"></span></button>
    <div id="actor" aria-label="相手役" role="img">
      <div class="shadow"></div><div class="leg left"></div><div class="leg right"></div>
      <div class="arm left"></div><div class="arm right"></div><div class="body"></div>
      <div class="head"><div class="hair"></div><div class="eyes"></div><div class="mouth"></div></div>
    </div>
    <video id="camera" playsinline muted aria-hidden="true"></video>
  </section>
  <section class="conversation" aria-label="会話">
    <div id="status" role="status">浜辺に、あなたのほかにもう一人います。</div>
    <p id="spoken" lang="en-US" hidden></p>
    <p id="heard" hidden></p>
    <small id="replySource" role="status" hidden></small>
    <p id="helpText" hidden></p>
    <p id="nameReviewRow" hidden><label>相手に教える名前 <input id="nameReview" type="text" maxlength="80" autocomplete="off"></label></p>
    <div id="confirm" hidden><button id="yes" aria-label="そう">✓</button><button id="no" aria-label="ちがう">✕</button></div>
    <p id="gestureStatus" hidden></p>
    <p><label>相手役 <select id="characterChoice"></select></label></p>
    <button id="openPlacement">水とコップの練習</button>
    <section id="placementLesson" aria-label="水とコップの練習" hidden>
      <div id="lessonObjects">
        <button data-target="water">💧 水</button>
        <button data-target="cup">🥛 空のコップ</button>
        <button id="lessonTable" data-target="place">▱ 台の上</button>
      </div>
      <button id="listenExample">音を聞く</button>
      <button id="recordLesson" hidden>録音する</button>
      <button id="resumeLessonMic">マイクを再開</button>
      <button id="proposePlacement">水を置くよう頼む</button>
      <button id="askPlacement">相手のお願いを聞く</button>
      <p id="lessonMove" role="status"></p>
      <form id="placementChoices" hidden>
        <label>物 <select name="object" required><option value="">選ぶ</option><option value="water">水</option><option value="cup">空のコップ</option></select></label>
        <label>場所 <select name="location" required><option value="">選ぶ</option><option value="place">台の上</option><option value="other">地面</option></select></label>
        <label>動作 <select name="action" required><option value="">選ぶ</option><option value="place">置く</option><option value="give">渡す</option></select></label>
        <button type="submit">動作をする</button>
        <button type="button" id="placementHint">身ぶりを見る</button>
      </form>
    </section>
    <button id="start" class="primary">島に入る</button>
    <details><summary>音声認識の設定</summary>
      <p><label>認識方法 <select id="speechMode"><option value="safari">Safari</option><option value="whisper">NAS（Whisper）</option></select></label></p>
      <p><label>名前を話す言語 <select id="nameLanguage"><option value="ja">日本語</option><option value="en">英語</option><option value="auto">自動判定（NAS限定）</option></select></label></p>
      <p><label>氏名の読みのヒント（任意） <input id="nameHint" maxlength="40" autocomplete="off" placeholder="例：やまだ けんた"></label></p>
      <p><label><input id="bargeIn" type="checkbox"> NAS（Whisper）で相手の話に割り込めるようにする（試験）</label></p>
    </details>
    <p id="speechStatus" role="status" hidden></p>
    <p id="replyTiming" hidden></p>
    <div id="controls" hidden><button id="help">日本語の助け</button><button id="repeat">もう一度聞く</button><button id="pause">一時停止</button></div>
    <details><summary>マイク・カメラと記憶データ</summary><p id="media">音声認識にはブラウザの機能を使います。自分の名前は、胸を指さしながら話してください。相手に呼びかけるときは、カメラに向かって指をさしながら話してください。カメラの映像は端末内で動作を判定します。</p><p>相手役の記憶はこのセッション内に保持します。ファイルとして取り出せます。</p><button id="export" disabled>記憶を書き出す</button> <button id="import">記憶を読み込む</button><input id="file" type="file" accept="application/json,.json" hidden></details>
  </section>
</main>
</body>
</html>
